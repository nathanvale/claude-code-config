# Zoom Recording Selector Registry
# Declarative selector data for Zoom recording transcript extraction.

_meta:
  domain: "*.zoom.us"
  schema_version: 2
  discovered_at: "2026-03-20"
  last_validated_at: "2026-03-20"
  last_validated_by: "nathanvale"
  notes:
    - "Selectors are declarative only. Executable flow lives in playbooks."
    - "Candidate repairs must be promoted only after revalidation."
    - "Works with any Zoom instance (monash.zoom.us, us02web.zoom.us, etc.)."

page_fingerprints:
  recording_play:
    url_contains:
      - "/rec/play"
    required_text:
      - "Audio Transcript"
  recording_passcode_gate:
    required_text:
      - "Passcode"
    alternate_text:
      - "Enter the passcode"
  zoom_signin:
    url_contains:
      - "zoom.us/signin"
  recording_expired:
    required_text_any:
      - "This recording has expired"
      - "Recording does not exist"

gotchas:
  continuemode_redirect:
    summary: "Share URLs redirect via continueMode, loading a different recording from the session playlist."
    ref: "gotchas.zoom-recording.md#continuemode-redirect"
  hub_share_unresolvable:
    summary: "Hub share URLs represent a shared folder, not a single recording. They rotate through recently-viewed recordings."
    ref: "gotchas.zoom-recording.md#hub-share-urls"
  transcript_dom_selectors:
    summary: "Use .transcript-container / .transcript-list (not [role=tabpanel]) for transcript DOM."
    ref: "gotchas.zoom-recording.md#transcript-dom-selectors"
  ts_is_string:
    summary: "The ts field in transcriptList is a string like '00:02:19.610', not milliseconds."
    ref: "gotchas.zoom-recording.md#ts-field-format"
  double_json_encoding:
    summary: "agent-browser eval wraps output in JSON. If eval returns JSON.stringify(), file gets double-encoded."
    ref: "gotchas.zoom-recording.md#double-json-encoding"
  api_extraction_preferred:
    summary: "play/info API returns full transcript as JSON. No DOM interaction needed when transcriptList is present."
    ref: "gotchas.zoom-recording.md#api-extraction"
  short_zoom_only_clips:
    summary: "'(Zoom only)' recordings may be very short pre-meeting clips (< 30s)."
    ref: "gotchas.zoom-recording.md#short-clips"

pages:
  recording_play:
    route:
      url_pattern: "https://{zoom-host}/rec/play/{recording-id}"
    regions:
      api:
        notes:
          - "play/info URL found via performance.getEntriesByType('resource') matching /nws/recording/1.0/play/info/"
          - "Response contains: result.hasTranscript (boolean), result.transcriptList (array)"
        fields:
          play_info_url:
            interaction: performance_entry_lookup
            pattern: "/nws/recording/1.0/play/info/"
            verify:
              type: url_match
          has_transcript:
            interaction: api_field
            path: "result.hasTranscript"
            verify:
              type: boolean
          transcript_list:
            interaction: api_field
            path: "result.transcriptList"
            verify:
              type: array_non_empty
            entry_schema:
              username: "string (speaker name)"
              ts: "string (HH:MM:SS.mmm start timestamp)"
              end_ts: "string (HH:MM:SS.mmm end timestamp)"
              text: "string (dialogue text)"
      transcript_tab:
        selector: "[role='tab']"
        fields:
          audio_transcript:
            interaction: click_if_not_selected
            locators:
              - strategy: text
                value: "Audio Transcript"
            verify:
              type: has_attribute
              attribute: "aria-selected"
              expected: "true"
      transcript_panel:
        fields:
          scroll_container:
            interaction: scroll_trigger
            gotchas:
              - transcript_dom_selectors
            locators:
              - strategy: css
                value: ".transcript-container"
                status: validated
              - strategy: css
                value: "[class*=transcript]"
                status: candidate
          transcript_list:
            interaction: extract_text
            verify:
              type: length_gt
              min: 200
            gotchas:
              - transcript_dom_selectors
            locators:
              - strategy: css
                value: ".transcript-list"
                status: validated
              - strategy: css
                value: "[class*=transcript]"
                status: candidate

  recording_passcode_gate:
    route:
      url_pattern: "https://{zoom-host}/rec/share/{share-id}"
    regions:
      passcode_form:
        fields:
          passcode_input:
            interaction: fill
            locators:
              - strategy: role
                value: "textbox"
                name: "Passcode"
                status: validated
              - strategy: css
                value: "input[type='password']"
                status: candidate
              - strategy: css
                value: "input#passcode"
                status: candidate
          access_button:
            interaction: click
            locators:
              - strategy: role
                value: "button"
                name: "Access Recording"
                status: validated
              - strategy: text
                value: "Access Recording"
                status: candidate

candidates:
  selectors: []
  promotions:
    policy: "Promote only after successful revalidation on a matching fingerprint."
