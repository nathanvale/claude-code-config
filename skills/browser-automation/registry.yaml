schema_version: 2

# Browser Session Registry
# Central session name registry -- prevents naming collisions.
# All agents share one real Chrome instance via connect 9223.
# Sessions are tab namespaces (shared cookies). Domain partitioning is the safety model.
#
# To add a new session:
#   1. Pick a unique session name (usually matches the domain key)
#   2. Verify no name collision below
#   3. Add entry
#   4. Create a config file if auth is needed
#
# For parallel dispatch, callers suffix the session name at runtime:
#   --session zoom-1, --session zoom-2 (ephemeral, no registry entry needed)

connection:
  mode: connect
  port: 9223
  chrome_profile: ~/.cache/chrome-agent  # used by Chrome launch flags, not agent-browser

sessions:
  personal:
    config: ~/.claude/skills/browser-automation/config.yaml

  monash:
    config: .claude/browser-configs/config.monash.yaml

  ellucian:
    config: .claude/browser-configs/config.ellucian.yaml

  monash-qa:
    config: .claude/browser-configs/config.monash-qa.yaml

  timesheet:
    config: .claude/browser-configs/config.fasttrack360.yaml

  zoom:
    config: ~/.claude/skills/browser-automation/config.yaml

  confluence:
    config: ~/.claude/skills/browser-automation/config.yaml

  classic-cinema:
    config: .claude/skills/classic-cinema/config.yaml

defaults:
  session: personal
