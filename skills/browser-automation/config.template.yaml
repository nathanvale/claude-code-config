# Browser Agent Configuration Template
# Copy this file to config.yaml and fill in your values.
# Contains no secrets -- only vault item names, URLs, and flags.

# Credential provider (currently only 1Password "op" CLI is supported)
credentials:
  provider: op
  default_vault: "Your Vault Name"

# Canonical identity for SSO flows (e.g. Google SSO)
# The agent verifies this email matches the logged-in account after auth.
# Remove this section if you don't use SSO.
identity:
  email: you@example.com
  provider: google

# Chrome launch settings
chrome:
  # Path to Chrome binary (macOS default shown, adjust for Linux/Windows)
  binary_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  # IMPORTANT: user_data_dir controls session isolation.
  # Chrome stores ALL cookies, auth state, and localStorage in this directory.
  # If two projects use different accounts but share the same user_data_dir,
  # the agent will silently authenticate as the wrong user.
  #
  # Use a unique path per account/project:
  #   ~/.cache/chrome-agent-work      (work Google account)
  #   ~/.cache/chrome-agent-personal  (personal Google account)
  #   ~/.cache/chrome-agent-client-x  (client project)
  user_data_dir: ~/.cache/chrome-agent
  debug_port: 9222
  # Additional non-safety flags (optional)
  # Safety flags (--no-first-run, --disable-sync, --disable-features) are always applied.
  # flags:
  #   - --proxy-server=http://localhost:8080
  #   - --window-size=1920,1080

# Registered services
# The agent can visit ANY URL without registration.
# Registering a service just gives the agent auth hints so it knows
# which login flow to use and where to find credentials.
#
# auth types:
#   sso            - Google SSO (cookie-based, uses identity.email)
#   password       - username/password from op vault
#   password_totp  - username/password + TOTP from op vault
#
# services:
#   my-service:
#     url: https://example.com/admin
#     auth: password
#     op_item: "Example Service"       # item name in your op vault
