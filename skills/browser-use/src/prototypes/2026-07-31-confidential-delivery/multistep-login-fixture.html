<!doctype html>
<!-- PROTOTYPE — throwaway, served over http. A multi-STEP login like FastTrack
     (username-first) PLUS an OTP screen, to prove an LLM-driven step engine that
     handles arbitrary step sequences. Screens advance: username -> password ->
     otp -> done. Each field commits on input/change only (ngModel-equivalent).
     The engine must classify each screen from its snapshot, deliver the right
     field, click the advance button, and re-snapshot. Secret-free. -->
<html lang="en"><head><meta charset="utf-8"><title>Login</title>
<style>body{font-family:system-ui;margin:1.5rem}.screen{display:none}.screen.active{display:block}.state{font-family:monospace;font-size:12px;background:#f6f6f6;padding:.5rem;white-space:pre-wrap;margin-top:1rem}</style>
</head><body ng-app>
  <h2 id="heading">Sign in</h2>

  <div class="screen active" data-step="username">
    <label>Username <input id="u" type="text" aria-label="Username" ng-model="login.username"></label>
    <button type="button" id="nextU" onclick="advance('username')">Next</button>
  </div>
  <div class="screen" data-step="password">
    <label>Password <input id="p" type="password" aria-label="Password" ng-model="login.password"></label>
    <button type="button" id="nextP" onclick="advance('password')">Continue</button>
  </div>
  <div class="screen" data-step="otp">
    <label>One-time code <input id="o" type="text" aria-label="One-time code" ng-model="login.otp"></label>
    <button type="button" id="nextO" onclick="advance('otp')">Verify</button>
  </div>
  <div class="screen" data-step="done"><h3 id="welcome">Welcome — signed in</h3></div>

  <div class="state" id="dump"></div>
  <script>
    const model={username:'',password:'',otp:''};
    const wire=(id,key)=>{const el=document.getElementById(id);const c=()=>{model[key]=el.value;dump();};el.addEventListener('input',c);el.addEventListener('change',c);};
    wire('u','username');wire('p','password');wire('o','otp');
    const order=['username','password','otp','done'];
    function current(){return document.querySelector('.screen.active').dataset.step;}
    function show(step){document.querySelectorAll('.screen').forEach(s=>{ s.classList.toggle('active',s.dataset.step===step); });
      document.getElementById('heading').textContent={username:'Sign in',password:'Enter password',otp:'Two-factor',done:'Done'}[step];dump();}
    function advance(from){
      // gate: the field for THIS step must be committed via events (not raw .value)
      if(from==='username'&&!model.username) return dump('BLOCKED: username empty');
      if(from==='password'&&!model.password) return dump('BLOCKED: password empty');
      if(from==='otp'&&!model.otp) return dump('BLOCKED: otp empty');
      show(order[order.indexOf(from)+1]);
    }
    function dump(n){document.getElementById('dump').textContent=(n?'>> '+n+'\n':'')+JSON.stringify({step:current(),model},null,2);}
    window.__ml=()=>({step:current(),model,signedIn:current()==='done'});
    dump('ready: step username');
  </script>
</body></html>
