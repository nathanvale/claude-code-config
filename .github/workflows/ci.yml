name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch; a new push cancels the previous.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + lint
    # macOS runner: the browser-use stack is darwin-oriented (1Password `op`,
    # Swift code-signing / App Sandbox custody, Agent Chrome). The U0 custody
    # tests spawn a native probe that requires a codesigning identity and
    # returns empty output on Linux (JSON parse EOF). Running on macos-latest
    # exercises them in their real environment; the suite is green there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Install workspace deps FIRST. Skipping this is what makes a fresh
      # checkout/worktree fail to resolve workspace packages (e.g.
      # @side-quest/browser-use-security) and every CLI-spawning test exit 1 —
      # a false "regression" that only reproduces without node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run biome:check

      # The confidential-delivery process-boundary suite drives the REAL
      # supervisor + field-delivery binaries (.build/debug), so build the
      # darwin-only Swift custody package before testing. Debug build covers
      # the existing deliver process-boundary suite (.build/debug binary).
      - name: Build Swift custody package
        run: swift build --package-path runtime/browser-use-environment-auth

      - name: Test Swift custody package
        run: |
          printf 'Runner image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          swift --version
          swift test --package-path runtime/browser-use-environment-auth

      - name: Build ApprovalBroker unsigned
        run: bun run --cwd runtime/browser-use-security build:unsigned

      - name: Test ApprovalBroker protocol hermetically
        run: bun run --cwd runtime/browser-use-security test:protocol

      # Manifest, policy, runtime-admission, refusal, and docs-drift tests for
      # Browser Use Security. These prove production promotion stays fail-closed
      # (native-capability-absent) and are the only gate on that behavior — a
      # regression here would otherwise merge green (Verification Contract, U2).
      - name: Test Browser Use Security
        run: bun run --cwd runtime/browser-use-security test

      # The auth-doctor process-boundary suite drives the RELEASE supervisor
      # (.build/release/browser-use-op-supervisor) and hard-fails when it is
      # absent (build, never skip). Build it so the real-binary proof runs in
      # CI instead of throwing.
      - name: Build Swift custody package (release)
        run: bun run --cwd runtime/browser-use-environment-auth build:release

      - name: Test (command entrypoint integration)
        run: bun run command-entrypoint:integration

      # Test scope: skills/browser-use/src, via the repo's test-runner (which
      # knows to exclude the intentional-fail fixtures under
      # skills/test-runner/src/fixtures that a bare `bun test` would count as
      # failures). This is the first CI on the repo; browser-use is proven green
      # (1619/0) and is the surface this workflow was added alongside. Widening
      # to the full suite is a follow-up gated on the pre-existing failures in
      # other subsystems (ac-convergence, LogTape, Station Map, setup) going
      # green first — those predate any CI and would make a full-suite gate
      # permanently red. Catching a browser-use cross-PR collision on-branch is
      # the immediate value; broader coverage lands incrementally.
      - name: Test (browser-use)
        run: bash skills/test-runner/src/test-runner.sh run -- skills/browser-use/src/

      # U8 governance gate for the vault-git write route: the skill contract
      # keeps fallback bound to the activation_blocked blocker. Instruction
      # health runs once in the qualification step below.
      - name: Test (vault-git skill contract)
        run: bash skills/test-runner/src/test-runner.sh run -- skills/vault-git/tests/

      - name: Test (agent-native test-design qualification)
        run: |
          bun skills/test-design/evals/qualification.ts deterministic
          bun skills/test-design/evals/qualification.ts verify

      - name: Typecheck Browser Use
        run: bun run --cwd skills/browser-use typecheck

      - name: Typecheck Browser Use Security
        run: bun run --cwd runtime/browser-use-security typecheck

      - name: Build and inspect public Browser Use package
        run: |
          bun run --cwd skills/browser-use build
          bun run --cwd skills/browser-use pack:dry-run
