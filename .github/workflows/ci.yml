name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch; a new push cancels the previous.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + lint
    # macOS runner: the browser-use stack is darwin-oriented (1Password `op`,
    # Swift code-signing / App Sandbox custody, Agent Chrome). The U0 custody
    # tests spawn a native probe that requires a codesigning identity and
    # returns empty output on Linux (JSON parse EOF). Running on macos-latest
    # exercises them in their real environment; the suite is green there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Install workspace deps FIRST. Skipping this is what makes a fresh
      # checkout/worktree fail to resolve workspace packages (e.g.
      # @side-quest/browser-use-security) and every CLI-spawning test exit 1 —
      # a false "regression" that only reproduces without node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run biome:check

      # Test scope: skills/browser-use/src, via the repo's test-runner (which
      # knows to exclude the intentional-fail fixtures under
      # skills/test-runner/src/fixtures that a bare `bun test` would count as
      # failures). This is the first CI on the repo; browser-use is proven green
      # (1619/0) and is the surface this workflow was added alongside. Widening
      # to the full suite is a follow-up gated on the pre-existing failures in
      # other subsystems (ac-convergence, LogTape, Station Map, setup) going
      # green first — those predate any CI and would make a full-suite gate
      # permanently red. Catching a browser-use cross-PR collision on-branch is
      # the immediate value; broader coverage lands incrementally.
      - name: Test (browser-use)
        run: bash skills/test-runner/src/test-runner.sh run -- skills/browser-use/src/
