version: 1
hub: my-second-brain
# Optional per-repo fields:
#   parent: <repo-name>   — declares this repo is a spoke of the named hub
#   spokes: [<repo-names>] — informational, lists spoke repos (canonical is parent: on each spoke)

repos:
  - name: my-second-brain
    profile: life-hub
    location: ~/code/my-second-brain
    collection: vault
    update_command: git -C ~/code/my-second-brain fetch --all --prune --quiet || true
    primary_paths:
      - 00 Inbox
      - 01 Projects
      - 02 Areas
      - 03 Resources
      - docs
      - memory
      - CLAUDE.md
      - AGENTS.md

  - name: monash-smst
    profile: work-hub
    spokes: [experience-sdk]
    location: ~/code/monash-smst
    collection: repo-monash-smst
    update_command: git -C ~/code/monash-smst fetch --all --prune --quiet || true
    primary_paths:
      - docs
      - memory
      - TASKS.md
      - CLAUDE.md
      - AGENTS.md

  - name: mac-mini-home-server
    profile: infra-repo
    location: ~/code/mac-mini-home-server
    collection: repo-mac-mini-home-server
    update_command: git -C ~/code/mac-mini-home-server fetch --all --prune --quiet || true
    primary_paths:
      - docs
      - memory
      - TASKS.md
      - CLAUDE.md
      - AGENTS.md

  - name: bun-typescript-starter
    profile: infra-repo
    location: ~/code/bun-typescript-starter
    collection: repo-bun-typescript-starter
    update_command: git -C ~/code/bun-typescript-starter fetch --all --prune --quiet || true
    primary_paths:
      - docs
      - memory
      - todos
      - CLAUDE.md
      - AGENTS.md

  - name: ellucian-api-catalog
    profile: reference-corpus
    location: ~/code/ellucian-api-catalog
    collection: repo-ellucian-api-catalog
    update_command: bun run ~/code/ellucian-api-catalog/scripts/sync.ts
    primary_paths:
      - apis
      - CLAUDE.md
      - AGENTS.md

  - name: ellucian-developer
    profile: reference-corpus
