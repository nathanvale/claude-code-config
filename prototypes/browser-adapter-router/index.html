<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Browser Adapter Router Prototype</title>
	<style>
		:root {
			--bg: #f6f8fb;
			--ink: #111820;
			--muted: #607080;
			--line: #d9e0e7;
			--panel: #ffffff;
			--blue: #2458b8;
			--green: #0f7b5f;
			--shadow: 0 16px 36px rgba(24, 37, 54, 0.12);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: var(--bg);
			color: var(--ink);
			font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			line-height: 1.45;
		}

		main {
			width: min(760px, calc(100vw - 32px));
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: var(--shadow);
			padding: clamp(22px, 5vw, 42px);
			display: grid;
			gap: 18px;
		}

		h1,
		p {
			margin: 0;
			letter-spacing: 0;
		}

		h1 {
			font-size: clamp(2rem, 5vw, 3.6rem);
			line-height: 1;
		}

		p {
			color: var(--muted);
			max-width: 68ch;
		}

		.links {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
		}

		a {
			display: inline-flex;
			align-items: center;
			min-height: 42px;
			border-radius: 8px;
			border: 1px solid var(--blue);
			color: var(--blue);
			text-decoration: none;
			font-weight: 700;
			padding: 9px 12px;
		}

		a.primary {
			background: var(--blue);
			color: #fff;
		}

		.badges {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.badge {
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--muted);
			padding: 6px 9px;
			font-size: 0.84rem;
		}
	</style>
</head>
<body>
	<main>
		<div class="badges">
			<span class="badge">research artifact</span>
			<span class="badge">not runtime truth</span>
			<span class="badge">Browser Adapter Router</span>
		</div>
		<h1>Browser Adapter Router</h1>
		<p>Static prototype for the V1 router design: capability report discovery, pure route evaluation, human status projection, candidate decisions, and fail-closed recovery.</p>
		<div class="links">
			<a class="primary" href="research.html">Open research prototype</a>
			<a href="../../skills/browser-use/docs/plans/2026-06-02-004-design-browser-use-adapter-router-plan.md">Open plan</a>
		</div>
	</main>
</body>
</html>
